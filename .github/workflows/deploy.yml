name: Deploy Proyecto Semestral

on:
  push:
    branches: [ "main" ] # Se activa cada vez que suben cambios al main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compilar Backend Ventas
      run: |
        cd "proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST-VENTAS"
        mvn clean package -DskipTests

    - name: Compilar Backend Despachos
      run: |
        cd "proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHOS"
        mvn clean package -DskipTests

    - name: Construir e Impulsar imágenes
      run: |
        docker build -t carolinaaaa/back-ventas:latest "proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST-VENTAS"
        docker build -t carolinaaaa/back-despachos:latest "proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHOS"
        
        docker push carolinaaaa/back-ventas:latest
        docker push carolinaaaa/back-despachos:latest
